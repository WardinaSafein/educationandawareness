<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#535353;
    --mid:#A8A8A8;
    --hair:#E6E6E6;
    --px:"Press Start 2P", ui-monospace, monospace;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --real:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--px);
    padding:24px 0 40px;min-height:100vh;
    display:flex;flex-direction:column;overflow-x:hidden;
  }
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:0 18px}

  /* ---------- header: one centred column, as wide as the email box ---------- */
  .hud{
    width:100%;max-width:676px;margin:0 auto;padding:0 18px;
    display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  }
  .hud .title{font-size:11px;letter-spacing:.16em;line-height:1.8;color:var(--ink)}
  .hud .nw{white-space:nowrap}
  .hud .stats{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .hud .sc{color:var(--mid);font-size:10px;letter-spacing:.2em}
  .hud .sc b{color:var(--ink);font-weight:400}
  .hearts{display:inline-flex;gap:5px}
  .heart{position:relative;display:block;width:21px;height:21px}
  .heart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .heart .full{transition:opacity .7s ease}
  .heart.gone .full{opacity:0}
  .snd{
    font-family:var(--px);font-size:9px;letter-spacing:.1em;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;padding:6px 8px;
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0;
  }
  .snd svg{display:block;width:12px;height:12px}
  .snd[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .snd:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ---------- game area (shakes as one) ---------- */
  #game{flex:1;display:flex;flex-direction:column}
  #game.shake{animation:shake .3s steps(6)}
  #game.quake{animation:quake .4s steps(8)}
  @keyframes shake{0%,100%{translate:0 0}20%{translate:-3px 1px}40%{translate:3px -1px}60%{translate:-2px 0}80%{translate:2px 1px}}
  @keyframes quake{0%,100%{translate:0 0}15%{translate:-5px 2px}30%{translate:5px -2px}45%{translate:-4px -1px}60%{translate:4px 2px}80%{translate:-2px 0}}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 0 4px}
  .stage > *{width:100%}

  /* ---------- the email ---------- */
  .client{
    max-width:640px;margin:0 auto;background:var(--paper);
    border:1px solid #DADCE0;border-radius:8px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.13),0 8px 26px rgba(0,0,0,.07);
    font-family:var(--real);
  }
  .bar{
    background:#F6F8FA;border-bottom:1px solid #E8EAED;
    display:flex;align-items:center;gap:13px;padding:9px 14px;
    font-size:12px;color:#5F6368;
  }
  .bar .sp{flex:1}
  .bar .ic{letter-spacing:.3em;color:#BDC1C6;font-size:13px}
  .subject{font-size:19px;font-weight:500;color:#202124;padding:17px 18px 12px;line-height:1.32}
  .sender{display:flex;gap:12px;padding:0 18px 14px;border-bottom:1px solid #EDEFF2;align-items:flex-start}
  .av{
    width:40px;height:40px;border-radius:50%;flex:none;background:#E3E6EA;color:#70757A;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  }
  .who{flex:1;min-width:0}
  .nm{font-size:14px;font-weight:600;color:#202124}
  .addr,.meta{font-size:13px;color:#5F6368;line-height:1.55;word-break:break-word}
  .stamp{font-size:12px;color:#80868B;flex:none;padding-top:2px}
  .body{padding:17px 18px 24px;font-size:14.5px;line-height:1.68;color:#202124}
  .body p{margin:0 0 12px}
  .body p:last-child{margin-bottom:0}
  .sig{color:#5F6368;font-size:13.5px}
  .link{color:#1A73E8;text-decoration:underline}
  .urlbar{
    display:inline-block;margin-top:4px;background:#F1F3F4;border:1px solid #E0E3E7;
    border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px;color:#5F6368;
  }
  .tap{cursor:pointer;border-bottom:2px dotted #9AA0A6;border-radius:0}
  .tap:hover,.tap:focus-visible{background:#F1F3F4;outline:none}
  .tap:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .tap.no{animation:wrong .24s steps(2) 2}
  @keyframes wrong{0%{translate:0}50%{translate:5px}100%{translate:0}}
  .tap.hit{background:var(--ink);color:#fff;border-bottom-color:var(--ink);padding:1px 4px}
  .tap.hit .urlbar,.tap.hit.urlbar{background:transparent;border-color:#8A8A8A;color:#fff}
  .locked .tap{cursor:default;border-bottom-color:transparent}
  .locked .tap:hover{background:transparent}
  .locked .tap.hit{background:var(--ink)}

  /* ---------- intro box ---------- */
  .bubble{
    position:relative;max-width:640px;margin:0 auto;
    border:3px solid var(--ink);background:var(--paper);
    padding:18px 20px;font-size:11px;line-height:2.05;color:var(--ink);
  }
  .bubble p{margin:0 0 10px;min-height:2.05em}
  .bubble p:last-child{margin:0}
  .bubble b{font-weight:400;text-shadow:1px 0 0 currentColor;letter-spacing:.04em}
  .caret{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- the world strip ---------- */
  .world{position:relative;height:262px;margin-top:8px}
  #cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .talk{
    position:absolute;left:0;top:0;z-index:2;
    width:max-content;max-width:min(340px,calc(100% - 16px));
    border:3px solid var(--ink);background:var(--paper);
    padding:9px 12px;font-size:10px;line-height:1.95;color:var(--ink);
  }
  .talk.hidden{visibility:hidden}
  .talk .tail{
    position:absolute;bottom:-11px;left:20px;width:12px;height:8px;background:var(--paper);
    clip-path:polygon(0 0,100% 0,50% 100%);
  }
  .talk .tail::before{
    content:"";position:absolute;left:-4px;top:0;width:20px;height:14px;background:var(--ink);
    z-index:-1;clip-path:polygon(0 0,100% 0,50% 100%);
  }
  .talk b{font-weight:400;text-shadow:1px 0 0 currentColor;letter-spacing:.04em}
  .det{position:absolute;left:0;top:0;z-index:1;cursor:pointer}
  .det:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  /* "MIMIC DEFEATED: Lookalike domain" */
  .banner{
    position:absolute;left:0;top:0;z-index:3;white-space:nowrap;
    border:3px solid #1A1A1A;background:var(--paper);color:#1A1A1A;
    font-size:10px;letter-spacing:.06em;padding:9px 12px;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .banner.show{opacity:1}
  .banner b{font-weight:400;text-shadow:1px 0 0 currentColor}

  /* ---------- below the line ---------- */
  .below{margin-top:16px}
  .lesson{border-top:2px solid var(--ink);border-bottom:1px solid var(--hair);padding:14px 0 16px}
  .lesson .tag{display:block;font-size:9px;letter-spacing:.22em;color:var(--mid);margin-bottom:9px}
  .lesson .txt{font-family:var(--mono);font-size:13.5px;line-height:1.65;color:#3D3D3D}
  .lesson .txt b{font-weight:700;color:#2B2B2B}
  .hidden{display:none}
  .controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .ctl{
    font-family:var(--px);font-size:10px;letter-spacing:.12em;
    padding:14px 20px;cursor:pointer;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:0;
  }
  .ctl:hover{background:var(--ink);color:var(--paper)}
  .ctl:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .ctl.go{background:var(--ink);color:var(--paper)}
  .ctl.go:hover{background:var(--paper);color:var(--ink)}
  .ctl:disabled,.ctl:disabled:hover{background:var(--hair);border-color:var(--mid);color:var(--mid);cursor:not-allowed}
  .note{font-size:9px;letter-spacing:.18em;color:var(--mid);align-self:center}

  .recap h2{font-size:13px;letter-spacing:.1em;margin:0 0 6px;color:var(--ink);line-height:1.6}
  .recap .sub{font-family:var(--mono);font-size:13px;color:var(--mid);margin:0 0 16px}
  .recap .sub b{color:var(--ink)}
  .recap ol{margin:0;padding:0;list-style:none;counter-reset:r}
  .recap li{
    counter-increment:r;display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:13.5px;color:#3D3D3D;line-height:1.5;
  }
  .recap li::before{content:counter(r,decimal-leading-zero);font-family:var(--px);font-size:9px;color:var(--mid);flex:none;padding-top:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (min-width:760px){
    body{padding:32px 0 56px}
    .hud .title{font-size:13px}
    .hud .sc{font-size:11px}
    .bubble{font-size:12px;padding:22px 24px;line-height:2.15}
    .talk{font-size:11px;padding:11px 14px}
    .banner{font-size:12px}
    .world{height:300px}
    .recap ol{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================= art =================
   All sprites are PNGs in assets/sprites/, drawn 1 file-pixel per art pixel and scaled up
   with smoothing off. Greys only: #1A1A1A, #535353, #A8A8A8, #D9D9D9, white. */
const META={"kak":{"stand":{"w":44,"h":98,"foot":22,"head":23},"run1":{"w":88,"h":105,"foot":37,"head":57},"run2":{"w":88,"h":105,"foot":37,"head":57},"shoot":{"w":109,"h":102,"foot":34,"head":42,"muzzle":[100,28]},"trip":{"w":84,"h":83,"foot":35,"head":53},"sword":{"w":70,"h":91,"foot":19,"head":20,"hand":[43,43]},"run3":{"w":88,"h":105,"foot":37,"head":57}}};
const SPRITES=["kak-stand","kak-run1","kak-run2","kak-run3","kak-shoot","kak-trip","kak-sword",
  "slime-1","slime-2","goblin-1","goblin-2","imp-1","imp-2",
  "boss-mimic","boss-fireimp","boss-shifter","boss-kobold","boss-ogre","boss-dragon"];
const IMG={};
const artReady=Promise.all(SPRITES.map(n=>new Promise(res=>{
  const im=new Image(); im.onload=()=>{ IMG[n]=im; res(); }; im.onerror=()=>res(); im.src="assets/sprites/"+n+".png";
})));
const GREYS=["#1A1A1A","#535353","#535353","#A8A8A8","#A8A8A8","#D9D9D9","#FFFFFF"];

/* ================= mails ================= */
const MAILS = [
  {
    subject:"Mailbox storage almost full",
    name:"IT Helpdesk", initials:"IT",
    addr:'&lt;<span class="tap" data-flag="1">it-support@petronas-helpdesk.com</span>&gt;',
    to:"to Ifan Benz", stamp:"09:14",
    body:`<p>Hi Ifan Benz,</p>
          <p>Your mailbox has reached <span class="tap">98% of its quota</span>. Please archive older items so incoming mail isn&rsquo;t rejected.</p>
          <p class="sig"><span class="tap">Regards,<br>Service Desk</span></p>`,
    hint:"Read everything after the @ sign. Slowly.",
    tag:"LOOKALIKE DOMAIN",
    lesson:"Our real helpdesk sends from <b>@petronas.com</b>. Anything with an extra word welded on &mdash; <b>-helpdesk</b>, <b>-support</b>, <b>-secure</b> &mdash; belongs to someone else. It only reads like us.",

    body:`<p><span class="tap">Dear User,</span></p>
          <p><span class="tap" data-flag="1">Your account will be permanently deleted within 24 hours unless you verify immediately.</span></p>

    addr:'&lt;<span class="tap">alerts@petronas.com</span>&gt;',
    to:"to Ifan Benz", stamp:"11:03",
    body:`<p>Reset your password here:</p>
          <p><span class="tap link">portal.petronas.com/reset</span><br>
          <span class="urlbar tap" data-flag="1">petronas-portal.verify-now.ru/login</span></p>

    hint:"The words and the destination disagree.",
    tag:"MISMATCHED LINK",
    lesson:"Link text is only text &mdash; anyone can type anything there. Hover on desktop, long-press on mobile, and read the <b>real</b> address first.",
    boss:"shifter", bossName:"Shapeshifter", scam:"Mismatched link"
  },
  {
    subject:"Action required: device verification failed",
    name:"IT Service Desk", initials:"SD",
    addr:'&lt;<span class="tap">servicedesk@petronas.com</span>&gt;',
    to:"to Ifan Benz", stamp:"10:41",
    body:`<p>Hi Ifan Benz,</p>
          <p><span class="tap">Your device failed this morning&rsquo;s routine verification check.</span> To restore access, complete the steps below:</p>
          <p><span class="tap" data-flag="1">1. Press <b>Windows + R</b><br>2. Press <b>Ctrl + V</b>, then Enter</span><br>
          <span class="urlbar tap">verification token already copied to your clipboard</span></p>
          <p class="sig"><span class="tap">This takes about ten seconds. No IT visit needed.</span></p>`,
    hint:"What is it asking you to do with your own keyboard?",
    tag:"CLICKFIX &mdash; PASTE AND RUN",
    lesson:"Nothing legitimate ever asks you to open Run and paste a command. There is no attachment to scan and no download to block, because <b>you</b> are the delivery mechanism. This is now the single most common way attackers get in &mdash; and no real IT team, and no real CAPTCHA, will ever ask it of you.",
    boss:"kobold", bossName:"Kobold Trickster", scam:"ClickFix paste-and-run"

  {

    addr:'&lt;<span class="tap">daniel.reyes@petronas.com</span>&gt;<br>reply-to: <span class="tap" data-flag="1">daniel.reyes.ciso@gmail.com</span>',
    to:"to Ifan Benz", stamp:"13:27",
    body:`<p>In meetings all afternoon &mdash; are you at your desk?</p>
          <p><span class="tap">Need you to sort something out for me, will explain shortly.</span></p>
          <p class="sig">Sent from my iPhone</p>`,

    boss:"ogre", bossName:"Two-headed Ogre", scam:"Reply-To spoof"

  {

    body:`<p>As part of our annual access review, <span class="tap" data-flag="1">please reply with your username and current password</span> so we can confirm your account.</p>

    boss:"dragon", bossName:"Small Dragon", scam:"Password request"

];
const RECAP=`<ol>
      <li>Read what comes after the @, not the display name</li>
      <li>A countdown is there to stop you thinking</li>
      <li>Link text lies &mdash; check where it really goes</li>
      <li>No genuine fix asks you to paste a command</li>

/* ================= sound (Web Audio, made on the fly) ================= */
let soundOn=false, unlocked=false, ac=null, master=null;
try{ soundOn = localStorage.getItem("kt-sound")==="on"; }catch(e){}
function audio(){
  if(!soundOn || !unlocked) return null;          /* never before the player's first click */
  if(!ac){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);
    }catch(e){ return null; }
  }
  if(ac.state==="suspended") ac.resume();
  return ac;
}
function tone(o){
  const a=audio(); if(!a) return;
  const t=a.currentTime+(o.delay||0), d=o.dur;
  const osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||"square";
  osc.frequency.setValueAtTime(o.f0,t);
  if(o.f1 && o.f1!==o.f0) osc.frequency.exponentialRampToValueAtTime(o.f1,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+d+0.03);
}
let noiseBuf=null;
function noise(o){
  const a=audio(); if(!a) return;
  if(!noiseBuf){
    noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);
    const ch=noiseBuf.getChannelData(0); for(let n=0;n<ch.length;n++) ch[n]=Math.random()*2-1;
  }
  const t=a.currentTime+(o.delay||0), d=o.dur;
  const src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  src.buffer=noiseBuf;
  f.type=o.filter||"bandpass"; f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f0,t);
  if(o.peak){ f.frequency.exponentialRampToValueAtTime(o.peak,t+d*0.45); f.frequency.exponentialRampToValueAtTime(o.f1||o.f0,t+d); }
  else if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol,t+(o.attack||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+d+0.03);
}
const SFX={
  pew(){ tone({type:"square",f0:1100,f1:260,dur:0.09,vol:0.022}); },
  pop(){ noise({f0:1600,f1:500,dur:0.08,vol:0.05,q:0.7}); tone({type:"triangle",f0:620,f1:180,dur:0.07,vol:0.035}); },
  thud(){ tone({type:"sine",f0:150,f1:45,dur:0.22,vol:0.2}); noise({filter:"lowpass",f0:420,f1:120,dur:0.12,vol:0.07}); },
  hurt(){ [494,392,294].forEach((f,k)=>tone({type:"square",f0:f,dur:0.09,vol:0.028,delay:0.05+k*0.09})); },

  whoosh(){ noise({f0:280,peak:3200,f1:500,dur:0.55,vol:0.11,q:1.4,attack:0.12}); },
  smash(){ noise({filter:"lowpass",f0:2400,f1:200,dur:0.45,vol:0.09}); tone({type:"sine",f0:110,f1:40,dur:0.35,vol:0.16}); },
  win(){ [523,659,784,1047].forEach((f,k)=>tone({type:"square",f0:f,dur:k===3?0.24:0.09,vol:0.028,delay:k*0.09})); },
  /* poke: a springy cartoon boing, ~0.35 s; pitch varies a little each time */

    lg.gain.setValueAtTime(f*0.35,t); lg.gain.exponentialRampToValueAtTime(f*0.02,t+d);

    o.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t+d+0.03); lfo.stop(t+d+0.03);

/* ================= Kak Timah ================= */
/* trip, ~0.8 s: lurch with "!", stumble (tripping drawing), land with a dust puff, pop back up */
const TRIP=[0.15,0.45,0.68], TRIP_MS=800;
const RUN_CYCLE=["run1","run2","run3","run2"], RUN_FPS=9;   /* 3-frame run, played 1-2-3-2 */
function pose(name,t){
  switch(name){
    case "run":   return {key:RUN_CYCLE[Math.floor(t)%4]};
    case "shoot": return {key:"shoot"};
    case "slash": return {key:"sword"};
    case "victory": { const h=Math.sin(Math.PI*Math.min(1,t)); return {key:"stand", dy:-h*10, sx:1-h*0.03, sy:1+h*0.04}; }
    case "trip": {
      if(reduce) return {key:"trip"};                                  /* a single stumble frame */
      if(t<TRIP[0]){ const k=t/TRIP[0]; return {key:"stand", lean:0.31*k, dx:3*k, bang:true}; }
      if(t<TRIP[1]){ const k=(t-TRIP[0])/(TRIP[1]-TRIP[0]); return {key:"trip", dy:-4*Math.sin(Math.PI*k)}; }
      if(t<TRIP[2]){ const k=(t-TRIP[1])/(TRIP[2]-TRIP[1]); return {key:"trip", lean:0.22*Math.min(1,k*2), sy:0.95}; }
      const k=(t-TRIP[2])/(1-TRIP[2]);
      return {key:"stand", dy:-9*Math.sin(Math.PI*Math.min(1,k*1.5)), lean:Math.sin(k*Math.PI*4)*0.06*(1-k)};
    }
    case "ouch": { if(reduce) return {key:"stand", sx:1.08, sy:0.92};
      const w=Math.sin(t*Math.PI*6)*(1-t); return {key:"stand", lean:w*0.18, sx:1.16-t*0.16, sy:0.84+t*0.16}; }
    default: return {key:"stand"};
  }
}
function drawKak(){
  const p=pose(kak.pose,kak.pt), m=K(p.key), img=IMG["kak-"+p.key]; if(!img) return;
  kak.tripImg = p.key;
  const w=m.w*S, h=m.h*S;
  ctx.save();
  ctx.translate(Math.round(kak.x+(p.dx||0)*S), Math.round(GY+3+(p.dy||0)*S));
  ctx.rotate(p.lean||0); ctx.scale(p.sx||1, p.sy||1);
  const ox=-m.foot*S, oy=-h;
  ctx.drawImage(img, Math.round(ox), Math.round(oy), w, h);
  if(p.bang){                                   /* a pixel "!" just in front of her head */
    const u=Math.max(3,Math.round(2*S)), bx=Math.round(ox+m.head*S+18*S), by=Math.round(oy+2*S);
    ctx.fillStyle="#1A1A1A"; ctx.fillRect(bx-u*1.5-2, by-u-2, u*3+4, u*9+4);
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(bx-u*1.5, by-u, u*3, u*9);
    ctx.fillStyle="#1A1A1A"; ctx.fillRect(bx-u/2, by, u, u*5); ctx.fillRect(bx-u/2, by+u*6, u, u);
  }
  if(p.key==="sword" && kak.arc>0) slashArc(ox+m.hand[0]*S, oy+m.hand[1]*S, kak.arc);
  ctx.restore();
}
function sparkle(x,y,k){
  ctx.save(); ctx.globalAlpha=k;
  const P=[[0,-2],[0,-1],[0,1],[0,2],[-2,0],[-1,0],[1,0],[2,0]];
  ctx.fillStyle="#1A1A1A"; for(const [dx,dy] of P) ctx.fillRect(Math.round(x+dx*S), Math.round(y+dy*S), Math.ceil(S), Math.ceil(S));
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(S), Math.ceil(S));
  ctx.restore();
}
/* solid crescent slash: always the same size */
function slashArc(cx,cy,k){
  const R=45*S, th=16*S, a0=-1.75, a1=0.95, mid=(a0+a1)/2;
  const crescent=(r,t)=>{ const ox=Math.cos(mid)*t, oy=Math.sin(mid)*t;
    ctx.beginPath(); ctx.arc(cx,cy,r,a0,a1); ctx.arc(cx-ox,cy-oy,r,a1-0.02,a0+0.02,true); ctx.closePath(); };
  ctx.save(); ctx.globalAlpha=k;
  crescent(R+2.5*S, th+3*S); ctx.fillStyle="#1A1A1A"; ctx.fill();
  crescent(R, th); ctx.fillStyle="#A8A8A8"; ctx.fill();
  crescent(R-1.5*S, th*0.45); ctx.fillStyle="#FFFFFF"; ctx.fill();
  ctx.restore();
  for(let n=0;n<12;n++){ const a=a0+(n+0.5)/12*(a1-a0), rr=R+(4+((n*53)%9))*S; sparkle(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, k); }
}
function dustPuff(x,y,k){
  const blobs=[[0,-4,4],[-8,-3,3],[8,-3,3],[-4,-8,2.5],[5,-8,2],[-12,-2,1.5],[12,-2,1.5]];
  ctx.save(); ctx.globalAlpha=k;
  const px=(cx,cy,r,col)=>{ ctx.fillStyle=col;
    for(let yy=-Math.ceil(r);yy<=Math.ceil(r);yy++) for(let xx=-Math.ceil(r);xx<=Math.ceil(r);xx++)
      if(xx*xx+yy*yy<=r*r) ctx.fillRect(Math.round(x+(cx+xx)*U*1.5), Math.round(y+(cy+yy)*U*1.5), Math.ceil(U*1.5), Math.ceil(U*1.5)); };
  for(const [dx,dy,r] of blobs) px(dx,dy,r+1,"#A8A8A8");
  for(const [dx,dy,r] of blobs) px(dx,dy,r,"#F2F2F2");
  ctx.restore();
}

/* ================= monsters ================= */
/* each minion type keeps ONE scale for both frames, so the frames swap without pulsing */
const MINION={
  slime:{h:52, fly:0,  v:30, ms:200},
  goblin:{h:60, fly:0, v:50, ms:180},
  imp:{h:56, fly:46,   v:70, ms:130},
};
const BOSS_H={mimic:140, fireimp:150, shifter:150, kobold:150, ogre:158, dragon:190};
function minionScale(type){ return MINION[type].h*U / IMG[type+"-1"].height; }
function spawn(x){
  const types=Object.keys(MINION), t=types[Math.floor(Math.random()*types.length)];
  const sc=minionScale(t);
  mons.push({type:t, x:x==null?W+8:x, sc, w:IMG[t+"-1"].width*sc, h:IMG[t+"-1"].height*sc, t:Math.random()*400});
}
function monFrame(m){ return reduce ? 0 : Math.floor(m.t/MINION[m.type].ms)%2; }
function monBottom(m){ const f=MINION[m.type].fly; return GY+3 - f*U + (f && !reduce ? Math.sin(m.t/120)*4*U : 0); }
function monBox(m){ const img=IMG[m.type+"-"+(monFrame(m)+1)], w=img.width*m.sc, h=img.height*m.sc; return {x:m.x, y:monBottom(m)-h, w, h, img}; }
function fire(m){
  m.targeted=true;
  shootUntil=performance.now()+170;
  const s=K("shoot");
  bolts.push({x:kak.x+(s.muzzle[0]-s.foot)*S, y:GY+3-s.h*S+s.muzzle[1]*S, m, a:0});
  SFX.pew();
}
/* chunky pixel squares that burst out and fade in ~0.5 s */
function burst(x,y,w,h,n,size,power){
  if(reduce) return;
  for(let k=0;k<n;k++){
    const sx=x+Math.random()*w, sy=y+Math.random()*h, cx=x+w/2, cy=y+h/2;
    const dx=sx-cx, dy=sy-cy, d=Math.hypot(dx,dy)||1, sp=power*(0.5+Math.random()*0.7);
    bits.push({x:sx, y:sy, vx:dx/d*sp, vy:dy/d*sp-power*0.35, s:Math.round(size*(0.7+Math.random()*0.6)),
      c:GREYS[Math.floor(Math.random()*GREYS.length)], life:500, max:500});
  }
}
function pop(m){
  m.dead=true;
  const b=monBox(m);
  burst(b.x,b.y,b.w,b.h,12,5*U,150);
  SFX.pop();
}

function startFinale(){

  const x=Math.min(W-w-10, kak.x+30*S+Math.max(50*U, colW*0.22));
  boss={img, w, h, x, y: reduce ? GY+3-h : -h-10, vy:0, ty:GY+3-h, landed:reduce};
  mons.forEach((mm,k)=>{ mm.popAt=k*90; });
  fin={t:0, pose:"stand", x0:kak.x, bossCx:x+w/2};
  say(`<b>THERE IT IS.</b> The ${m.bossName}!`);

function finUpdate(dt){
  fin.t+=dt; const t=fin.t;
  mons.forEach(m=>{ if(!m.dead && m.popAt!=null && t>=m.popAt) pop(m); });
  if(reduce){
    if(t>=900 && boss){ boss=null; kak.arc=0; SFX.smash(); defeated(); }
    if(t>=1100 && !fin.won) win();
    return;
  }
  if(boss && !boss.landed && t>250){
    boss.vy+=2600*dt/1000; boss.y+=boss.vy*dt/1000;
    if(boss.y>=boss.ty){ boss.y=boss.ty; boss.landed=true; SFX.thud(); shake("shake"); puffs.push({x:boss.x+boss.w*0.25,t:0},{x:boss.x+boss.w*0.75,t:0}); }
  }
  if(t>=950 && !fin.drawn){ fin.drawn=true; fin.pose="slash"; SFX.shing(); }
  if(t>=1250 && !fin.dashed){ fin.dashed=true; SFX.whoosh(); }
  const sw=K("sword"), tx=boss ? boss.x-(sw.w-sw.foot)*S*0.55 : kak.x;
  if(t>=1250 && t<1430 && boss){ const k=(t-1250)/180; kak.x=fin.x0+(tx-fin.x0)*k*k; }
  if(t>=1430 && !fin.hit && boss){
    fin.hit=true; fin.hitAt=t; kak.x=tx;
    impact=1;
    burst(boss.x, boss.y, boss.w, boss.h, 46, 7*U, 260);
    boss=null;
    SFX.smash(); shake("quake");

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(50, now-last); last=now;
  update(dt, now); draw(now);
  requestAnimationFrame(frame);
}
function update(dt, now){
  const s=dt/1000;
  speed += (targetSpeed-speed)*Math.min(1, s*7);
  if(Math.abs(speed)<0.5 && targetSpeed===0) speed=0;
  if(!reduce) scroll += speed*s;
  const f = RUN ? speed/RUN : 0;
  if(!reduce) clouds.forEach(c=>{ c.x -= (8 + speed*0.12)*s; if(c.x<-40){ c.x=W+Math.random()*160; c.y=14+Math.random()*50; } });

  if(scene==="chase" && !reduce && !trip){
    runT+=dt;
    spawnIn-=dt; if(spawnIn<=0){ spawn(); spawnIn=1000+Math.random()*1200; }
    cool-=dt;
    if(cool<=0){
      const tgt=mons.filter(m=>!m.targeted && !m.dead && m.x<W-16 && m.x>kak.x+40*S).sort((a,b)=>a.x-b.x)[0];
      if(tgt){ fire(tgt); cool=420; }
    }
  }
  if(trip) tripUpdate(dt);
  if(fin && scene==="finale") finUpdate(dt);

  if(!reduce) for(const m of mons){ m.x -= (speed + MINION[m.type].v*U*f)*s; m.t += dt*(0.3+0.7*f); }
  for(const b of bolts){
    const box=monBox(b.m), tx=box.x+box.w/2, ty=box.y+box.h/2, dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy);
    b.a=Math.atan2(dy,dx);
    if(d<12 || b.m.dead){ if(!b.m.dead) pop(b.m); b.done=true; }
    else { b.x+=dx/d*760*s; b.y+=dy/d*760*s; }
  }
  bolts=bolts.filter(b=>!b.done);
  mons=mons.filter(m=>!m.dead && m.x>-120);
  for(const p of bits){ p.vy+=500*s; p.x+=p.vx*s; p.y+=p.vy*s; p.life-=dt; }
  bits=bits.filter(p=>p.life>0);
  puffs.forEach(p=>p.t+=dt); puffs=puffs.filter(p=>p.t<650);
  if(impact>0) impact=Math.max(0, impact-s*6);

  /* her pose */
  const hop = reduce ? 0 : Math.min(1,(now%1300)/450);
  let pose="stand", pt=0;
  if(now-kak.ouchAt<1100){ pose="ouch"; pt=(now-kak.ouchAt)/1100; }
  else if(trip){ pose="trip"; pt=reduce?0.3:trip.t/TRIP_MS; }
  else if(scene==="finale"){ pose=fin.pose; pt=pose==="victory"?hop:0; }
  else if(scene==="chase"){
    if(reduce || now<shootUntil) pose="shoot";
    else { pose="run"; pt=runT*RUN_FPS/1000; }
  }
  else if(scene==="won"||scene==="done"){ pose="victory"; pt=hop; }
  kak.pose=pose; kak.pt=pt;

  const st=K("stand"), d=$("det");
  d.style.transform=`translate(${Math.round(kak.x-st.foot*S)}px,${Math.round(GY+3-st.h*S)}px)`;
  d.style.width=Math.round(st.w*S)+"px"; d.style.height=Math.round(st.h*S)+"px";
  placeTalk();
}
const DASHES=[[16,8,9],[44,13,3],[71,7,13],[103,12,5],[127,9,3],[149,14,8],[178,8,6]];
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  const R=Math.round;
  ctx.fillStyle="#A8A8A8";
  for(const c of clouds) CLOUD.forEach((row,y)=>{ for(let x=0;x<row.length;x++) if(row[x]==="l") ctx.fillRect(R(c.x+x*2*U), R(c.y+y*2*U), Math.ceil(2*U), Math.ceil(2*U)); });

  ctx.fillStyle="#535353"; ctx.fillRect(0,GY,W,2);
  ctx.fillStyle="#A8A8A8";
  const off=((scroll%200)+200)%200;
  for(let x0=-off; x0<W; x0+=200) for(const [dx,dy,w] of DASHES) ctx.fillRect(R(x0+dx), GY+dy, w, 2);

  for(const m of mons){ const b=monBox(m); ctx.drawImage(b.img, R(b.x), R(b.y), R(b.w), R(b.h)); }
  if(boss){ const bob = boss.landed && !reduce && Math.floor(now/450)%2 ? -2*U : 0;     /* gentle 2-frame idle bob */
    ctx.drawImage(boss.img, R(boss.x), R(boss.y+bob), R(boss.w), R(boss.h)); }

  drawKak();
  for(const p of puffs) if(p.t>=0){ const k=p.t/650; dustPuff(p.x, GY+2-k*6, 1-k*k); }

  for(const b of bolts){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
    ctx.fillStyle="#1A1A1A"; ctx.fillRect(-7,-2,14,4);
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(-5,-1,10,2);
    ctx.restore();
  }
  for(const p of bits){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle="#1A1A1A"; ctx.fillRect(R(p.x)-1,R(p.y)-1,p.s+2,p.s+2); ctx.fillStyle=p.c; ctx.fillRect(R(p.x),R(p.y),p.s,p.s); }
  ctx.globalAlpha=1;
  if(impact>0 && fin){            /* short white flash at the point of impact only */
    ctx.globalAlpha=impact*0.8; ctx.fillStyle="#FFFFFF";
    ctx.beginPath(); ctx.arc(kak.x+50*S, GY-50*S, 40*S, 0, 7); ctx.fill(); ctx.globalAlpha=1;
  }
}

/* ---------- poke ---------- */
const OUCH=["Hey! I&rsquo;m trying to protect us!","Aduh!","Hey, my glasses!","Gotcha, malware! &hellip;oh, it&rsquo;s you.","Poke the email, not me!","Focus! The monsters are coming!"];
let lastOuch=-1;
function poke(){
  if(poking || trip || scene==="finale") return;
  poking=true;
  backLine=$("line").innerHTML;
  let n; do { n=Math.floor(Math.random()*OUCH.length); } while(n===lastOuch);   /* never the same line twice in a row */
  lastOuch=n;
  setLine(OUCH[n]);
  kak.ouchAt=performance.now();
  SFX.boing();
  setTimeout(()=>{ poking=false; setLine(backLine); }, reduce?900:1100);
}

/* ================= intro ================= */
const BRIEF=[
  "Kak Timah needs your eyes.",
  "<b>Click the lie in each email to report it.</b>",
  "Careful: 4 hearts only."
];
let typing=false, typed=false;
function skipTyping(){ if(typed) return; typing=false; typed=true; BRIEF.forEach((t,n)=>$("bl"+n).innerHTML=t); }
function typeBrief(){
  typing=true; let li=0;
  const step=()=>{
    if(li>=BRIEF.length){ typing=false; typed=true; return; }
    const el=$("bl"+li), src=BRIEF[li]; let k=0;
    const tick=()=>{
      if(!typing) return;
      if(k>=src.length){ el.innerHTML=src; li++; setTimeout(step,320); return; }
      if(src[k]==="<"||src[k]==="&"){ const end=src.indexOf(src[k]==="<"?">":";",k); k = end===-1 ? k+1 : end+1; } else k++;
      el.innerHTML=src.slice(0,k)+'<span class="caret">_</span>';
      setTimeout(tick,24);
    };
    tick();
  };
  step();
}

/* ================= game ================= */
function controls(html){ $("controls").innerHTML=html; }

function render(){
  const m=MAILS[i];
  solved=false; ready=false; done=false; poking=false;
  hearts=MAXH; drawHearts();                 /* hearts refill on every new email */
  scoreboard();
  $("lesson").classList.add("hidden");
  $("mail").classList.remove("locked");
  $("mail").style.fontFamily="";
  $("mail").innerHTML=`
    <div class="bar"><span>&#8249;</span><span>Inbox</span><span class="sp"></span><span class="ic">&#8617; &#9633; &#8942;</span></div>
    <div class="subject">${m.subject}</div>
    <div class="sender">
      <div class="av">${m.initials}</div>
      <div class="who"><div class="nm">${m.name}</div><div class="addr">${m.addr}</div><div class="meta">${m.to}</div></div>
      <div class="stamp">${m.stamp}</div>
    </div>
    <div class="body">${m.body}</div>`;
  $("mail").querySelectorAll(".tap").forEach(el=>{
    el.tabIndex=0; el.setAttribute("role","button");
    el.addEventListener("click",()=>pick(el));
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(el); } });
  });
  controls('<button class="ctl" id="btnHint">HINT</button><button class="ctl go" id="btnNext" disabled>NEXT</button>');
  $("btnHint").addEventListener("click",()=>{ if(!solved) say(MAILS[i].hint); });
  $("btnNext").addEventListener("click",next);
  startChase();
  ask();
}
function ask(){
  if(solved) return;
  say('Something in here is lying to me. <b>I cannot tell what.</b><span class="caret">_</span>');
}
function pick(el){
  if(solved || !started) return;
  if(el.dataset.flag==="1"){
    solved=true; found++;
    clearTimeout(talkTimer);
    scoreboard();
    el.classList.add("hit");
    $("mail").classList.add("locked");
    startFinale();
    return;
  }
  el.classList.add("no");
  setTimeout(()=>el.classList.remove("no"),480);
  if(trip) return;                       /* still on the floor: don't charge twice */
  startTrip();
  sr(hearts>0 ? `Not the clue. You lose a heart.` : `Not the clue.`);
  /* after she gets back up: two bubbles, then back to running */
  clearTimeout(talkTimer);
  talkTimer=setTimeout(()=>{
    if(solved) return;
    sayRun([["Oops, let&rsquo;s try again!",1500],["Think before you click&hellip;",2000]], ()=>{ if(!solved && scene==="chase") ask(); });
  }, reduce?0:TRIP_MS);
}
function next(){ if(!ready) return; hideBanner(); if(i<MAILS.length-1){ i++; render(); } else finish(); }
function restart(){ i=0; found=0; trips=0; done=false; render(); }

function finish(){
  done=true; solved=true; scene="done"; mons=[]; bolts=[]; boss=null; targetSpeed=0;
  kak.x=homeX(); kak.arc=0;
  $("lesson").classList.add("hidden");
  $("mail").classList.add("locked");
  const tripTxt = `${trips} trip${trips===1?"":"s"}`;
  $("mail").innerHTML=`<div class="body"><div class="recap">
    <h2>SIX THINGS TO CHECK</h2>
    <p class="sub"><b>Caught ${found} of ${MAILS.length} &middot; ${tripTxt}</b> &middot; before you click anything</p>
    ${RECAP}</div></div>`;
  $("mail").style.fontFamily="var(--px)";
  controls('<button class="ctl go" id="btnAgain">RUN IT AGAIN</button>');
  $("btnAgain").addEventListener("click",restart);
  say((found===MAILS.length ? "<b>All six.</b> " : `<b>${found} of ${MAILS.length}.</b> `) + "Nice work! Reporting is what really matters.");
  sr(`Caught ${found} of ${MAILS.length}, ${tripTxt}.`);
  label("Kak Timah celebrating after all six monsters were reported");
}

/* ================= start ================= */
function start(){
  if(started) return;
  started=true;
  skipTyping();
  $("brief").classList.add("hidden");
  $("mailHost").classList.remove("hidden");
  layout();
  render();
}
$("det").addEventListener("click",poke);
$("det").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); poke(); } });
$("snd").addEventListener("click",()=>{
  soundOn=!soundOn; unlocked=true;
  try{ localStorage.setItem("kt-sound", soundOn?"on":"off"); }catch(e){}
  sndButton();
  if(soundOn) SFX.pop();
});
["pointerdown","keydown"].forEach(t=>addEventListener(t,()=>{ unlocked=true; },{capture:true}));

layout();
kak.x=homeX();
sndButton(); drawHearts(); scoreboard();
say("Morning! I&rsquo;m Kak Timah. Grab a coffee &mdash; this will not take long.");
controls('<button class="ctl go" id="btnStart">OPEN THE INBOX</button><span class="note">6 MESSAGES &nbsp;/&nbsp; 3 MINUTES</span>');
$("btnStart").addEventListener("click",start);
setTimeout(()=>{ reduce ? skipTyping() : typeBrief(); }, reduce?0:600);
artReady.then(()=>requestAnimationFrame(frame));

addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  const k=e.key.toLowerCase();
  if(!started && (k==="n"||e.key===" ")){ e.preventDefault(); start(); return; }
  if(!started) return;
  if(k==="n"){
    e.preventDefault();
    if(done) restart();
    else if(ready) next();
    else if(!solved) say("Report the lie first &mdash; <b>then</b> NEXT.");   /* no skipping */
  }
  if(k==="h" && !solved){ e.preventDefault(); say(MAILS[i].hint); }
});
let rz;
addEventListener("resize",()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{ layout(); if(scene!=="won" && scene!=="finale") kak.x=homeX(); },120);
});
</script>
