<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &middot; Spot and Report</title>
<meta name="robots" content="noindex">
<script>
/* Near-misses of a real address ("/kak-timah/", "/Kak-Timah", "/kak-timah.html/")
   go straight to the right page. Anything else shows the page below. */
(function(){
  var p = location.pathname.toLowerCase().replace(/\/+$/, "").replace(/\.html?$/, "");
  var go = { "/kak-timah": "/kak-timah", "/kaktimah": "/kak-timah", "/kak_timah": "/kak-timah",
             "/timah": "/kak-timah", "/index": "/" }[p];
  if (go && go !== location.pathname) location.replace(go + location.search + location.hash);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FFFFFF; --ink:#535353; --mid:#A8A8A8; --px:"Press Start 2P", ui-monospace, monospace; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--px);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
  main{max-width:520px}
  img{width:132px;height:auto;image-rendering:pixelated;display:block;margin:0 auto 28px}
  h1{font-size:14px;letter-spacing:.12em;line-height:1.8;margin:0 0 16px;font-weight:400}
  p{font-size:10px;line-height:2;color:var(--mid);margin:0 0 28px}
  a{display:inline-block;font-family:var(--px);font-size:10px;letter-spacing:.1em;color:var(--ink);
    text-decoration:none;border:3px solid var(--ink);padding:12px 16px;margin:6px}
  a:hover,a:focus-visible{background:var(--ink);color:var(--paper);outline:none}
</style>
</head>
<body>
<main>
  <img src="/assets/sprites/kak-trip.png" alt="">
  <h1>OOPS, THIS PAGE<br>DOES NOT EXIST</h1>
  <p>The link may have a typo.</p>
  <a href="/kak-timah">PLAY KAK TIMAH</a>
</main>
</body>
</html>
